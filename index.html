<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarAtlas | 3D Automotive Explorer</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <!-- 3D Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- UI Layer -->
    <main id="ui-layer">
      
      <header class="glass-panel top-bar">
        <h1>CarAtlas</h1>
        <nav>
          <button id="btn-showroom" class="active">Showroom</button>
          <button id="btn-aero">Aero Lab</button>
          <button id="btn-garage">My Garage</button>
        </nav>
      </header>

      <!-- Vehicle Selection Modal (Grid) -->
      <div id="selection-overlay" class="glass-panel centered-overlay">
        <h2>Select a Vehicle</h2>
        <div class="card-grid" id="vehicle-grid">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Specs Sidebar (Hidden initially) -->
      <div id="specs-sidebar" class="sidebar glass-panel right-panel hidden">
        <div class="sidebar-header">
          <h2 id="current-car-name">Vehicle Name</h2>
          <button id="btn-change-car" class="icon-btn">✕</button>
        </div>
        
        <div id="specs-content">
          <!-- Populated by JS -->
        </div>
        
        <div id="interactions" class="hidden">
          <h3>Colors</h3>
          <div id="color-picker">
            <!-- Populated by JS -->
          </div>
        </div>

        <div id="aero-controls" class="hidden">
          <h3>Wind Tunnel Controls</h3>
          <input type="range" id="wind-speed" min="1" max="100" value="50" class="slider">
          <label for="wind-speed">Wind Speed</label>
        </div>
      </div>

    </main>

    <div id="loading-screen" class="glass-panel hidden">
      <h2 id="loading-text">Loading Asset...</h2>
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
